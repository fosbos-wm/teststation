<!DOCTYPE html>
<html lang="de"><head><script src="../js/gate.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernrallye Entwicklungsbedingungen</title>
<style>
:root{
  --ink:#1b2a3a; --muted:#4a5d6e; --paper:#ffffff; --bg:#eaf0f4; --line:#d0dbe3;
  --bew:#e9a812; --bew-t:#fff1cf; --bew-d:#6b4a00;
  --vor:#17766f; --vor-t:#d6efec;
  --unb:#4a4fb3; --unb-t:#e1e2f8;
  --ok:#1b7a43; --ok-t:#dff3e6; --bad:#b3261e; --bad-t:#fbe3e0;
  --accent:#0b5c75;
  --f-display:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.sheet{max-width:880px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 26px 26px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.logo{height:46px;width:auto;display:block}
.meta{font-size:14px;color:var(--muted);text-align:right;line-height:1.35}
.meta strong{color:var(--ink);font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.6vw,36px);line-height:1.12;margin:0 0 8px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
p{margin:0 0 10px}
.lead{font-size:18px;color:var(--muted);max-width:68ch}
.ice{position:relative;width:100%;aspect-ratio:600/420}
.ice svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-family:var(--f-display);font-weight:700;font-size:15px}
.tag.bew{background:var(--bew);color:#2b1d00}.tag.vor{background:var(--vor);color:#fff}.tag.unb{background:var(--unb);color:#fff}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.path{display:flex;align-items:center;gap:0;margin:16px 0 18px;overflow-x:auto;padding:4px 2px}
.node{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;border:3px solid var(--line);background:#fff;color:var(--muted)}
.node.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px #d5eaf2}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.link{flex:1;min-width:14px;height:4px;background:var(--line)}
.link.done{background:var(--ok)}
.card{border:2px solid var(--ink);border-radius:12px;padding:18px 20px;background:#fff}
.card .kicker{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.card h2{margin:4px 0 12px;font-size:23px}
.case{background:#f4f7fa;border-left:5px solid var(--unb);padding:10px 14px;border-radius:6px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.o{text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;padding:11px 14px;font-size:17px;color:var(--ink)}
.o:hover:not(:disabled){border-color:var(--accent);background:#f1f8fb}
.o.right{border-color:var(--ok);background:var(--ok-t)}
.o.wrong{border-color:var(--bad);background:var(--bad-t);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.o:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;display:none;font-size:16px}
.fb.show{display:block}.fb.bad{background:var(--bad-t);color:#7d1913}.fb.ok{background:var(--ok-t);color:#0f4f2b}
.get{display:none;align-items:center;gap:12px;margin-top:12px}
.get.show{display:flex}
.letter{width:54px;height:54px;border-radius:10px;background:var(--bew);color:#2b1d00;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:30px;animation:pop .4s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.btn{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 20px;font-weight:700;font-size:16px}
.collected{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
.collected .lab{font-size:15px;color:var(--muted);margin-right:4px}
.slotl{width:44px;height:48px;border:2px dashed #8ea2b2;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--ink)}
.slotl.on{border:2px solid var(--bew);background:var(--bew-t)}
.final input{font:inherit;font-size:20px;text-transform:uppercase;letter-spacing:.12em;padding:8px 12px;border:2px solid #8ea2b2;border-radius:8px;width:12ch;max-width:100%}
.cert{display:none;text-align:center;border:3px double var(--ink);border-radius:12px;padding:26px 18px;background:linear-gradient(#fffdf5,#fff6dc)}
.cert.show{display:block}
.cert .big{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.1;margin:6px 0 10px}
.restart{margin-top:14px}
@media (max-width:700px){.sheet{padding:16px}.meta{text-align:left}.node{width:38px;height:38px;font-size:16px}}
</style></head><body>

 {t:'Die Anlage',q:'Was bezeichnet man in der Entwicklungspsychologie als „Anlage“?',o:['Alle Einflüsse, denen ein Mensch nach der Geburt von außen ausgesetzt ist.','Die genetische Ausstattung, die bei der Befruchtung festgelegt wird.','Die Kräfte, mit denen sich ein Mensch aktiv selbst steuert.'],a:1,L:'M',h:'Denk daran, was bei der Befruchtung schon feststeht.',w:'Die Anlage ist die genetische Ausstattung. Sie ist das Entwicklungspotenzial, das die Umwelt entfalten muss.'},

var cur=0,tries=0,got=[],stage=document.getElementById('stage'),path=document.getElementById('path'),col=document.getElementById('collected');
function drawPath(final){path.innerHTML='';for(var i=0;i<ST.length;i++){
  var n=document.createElement('div');n.className='node'+(i<cur||final?' done':(i===cur?' cur':''));n.textContent=i<cur||final?'✓':String(i+1);path.appendChild(n);

  else{h.textContent=d.q}

  var fb=document.createElement('div');fb.className='fb';fb.setAttribute('role','status');
  var get=document.createElement('div');get.className='get';
  d.o.forEach(function(t,i){var b=document.createElement('button');b.className='o';b.textContent=t;

      if(i===d.a){b.classList.add('right');Array.prototype.forEach.call(o.children,function(x){x.disabled=true});
        fb.className='fb show ok';fb.textContent='Richtig! '+d.w;got[cur]=d.L;
        get.className='get show';get.innerHTML='<div class="letter">'+d.L+'</div><span>Dein Buchstabe für Station '+(cur+1)+'</span>';
        var nx=document.createElement('button');nx.className='btn';nx.textContent=cur<ST.length-1?'Weiter zur nächsten Station':'Zum Lösungswort';
        nx.addEventListener('click',function(){cur++;if(cur<ST.length){show()}else{finale()}});get.appendChild(nx);drawLetters();nx.focus();}
      else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');b.disabled=true;fb.className='fb show bad';fb.textContent='Noch nicht. Tipp: '+d.h}
    });o.appendChild(b)});

}
function finale(){
  drawPath(true);drawLetters();stage.innerHTML='';
  var c=document.createElement('section');c.className='card final';

  '<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input id="word" type="text" autocomplete="off" aria-label="Lösungswort" maxlength="14"><button class="btn" id="ok">Prüfen</button></div><div class="fb" id="wfb" role="status"></div>';
  stage.appendChild(c);

  function check(){var f=document.getElementById('wfb');
    if(inp.value.trim().toUpperCase()==='SYSTEM'){stage.innerHTML='';var ce=document.createElement('section');ce.className='cert show';
      ce.innerHTML='<div class="kicker" style="font-family:var(--f-display);font-weight:700;color:var(--accent);letter-spacing:.06em">LERNRALLYE GESCHAFFT</div><div class="big">SYSTEM</div><p>Du hast alle sechs Stationen zu den Entwicklungsbedingungen gelöst.<br>Fehlversuche: '+tries+'</p><button class="btn restart" id="re">Rallye neu starten</button>';
      stage.appendChild(ce);document.getElementById('re').addEventListener('click',function(){cur=0;tries=0;got=[];show()})}
    else{f.className='fb show bad';f.textContent='Das passt noch nicht. Tipp: Das Wort beginnt mit S und endet mit M.'}}
  document.getElementById('ok').addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
}
show();
})();
